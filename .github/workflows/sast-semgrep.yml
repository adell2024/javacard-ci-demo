name: SAST - Semgrep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Requis pour uploader les résultats dans l'onglet Security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Lancer Semgrep sur le code Java
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude 'tests/' \
            --json --output semgrep-results.json \
            src/ scripts/ || true # || true pour ne pas faire échouer le job immédiatement

      - name: Uploader les résultats de l'analyse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Afficher le résumé
        if: always()
        run: |
          echo "=== Résultats Semgrep ==="
          if [ -f semgrep-results.json ]; then
            cat semgrep-results.json | head -100
          fi
